name: Build Tetris APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Descargar Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip

      - name: Preparar proyecto
        id: prep
        run: |
          if [ -f tetris.zip ]; then
            unzip -o tetris.zip
            echo "dir=TetrisClone" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        run: $GITHUB_WORKSPACE/gradle-8.7/bin/gradle -p ${{ steps.prep.outputs.dir }} assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: tetris-apk
          path: ${{ steps.prep.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          
